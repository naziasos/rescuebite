<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<h1>Delivery List</h1>

<hr>

<a href="/delivery/create-delivery/">

    Add Delivery

</a>

<hr>

{% for delivery in deliveries %}

    <p>

        Status:
        {{ delivery.status }}

    </p>

    <p>

        Claim:
        {{ delivery.claim.food.food_name }}

    </p>

    <p>

        Volunteer:
        {{ delivery.volunteer.user.username }}

    </p>

    <a href="/delivery/update-delivery/{{ delivery.id }}/">

        Update

    </a>

    <hr>

{% endfor %}

{% endblock %}
</body>
</html>
