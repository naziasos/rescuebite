<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<h1>NGO List</h1>

<hr>

<a href="/ngo/create-ngo/">

    Add NGO

</a>

<hr>

{% for ngo in ngos %}

    <h3>{{ ngo.ngo_name }}</h3>

    <p>User: {{ ngo.user.username }}</p>

    <a href="/ngo/update-ngo/{{ ngo.id }}/">

        Update

    </a>

    <hr>

{% endfor %}

{% endblock %}
</body>
</html>
