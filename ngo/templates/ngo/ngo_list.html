{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="ngo-page">

    <!-- ================= NGO HEADER ================= -->

    <div class="ngo-header">

        <h2>

            NGO List

        </h2>

        <a href="{% url 'create_ngo' %}" class="add-btn">

            + Add NGO

        </a>

    </div>

    <!-- ================= NGO DATABASE LIST ================= -->

    <div class="ngo-grid">

        {% for ngo in ngos %}

        <div class="ngo-card">

            <h3 class="ngo-name">

                {{ ngo.ngo_name }}

            </h3>

            <p>

                Username: {{ ngo.user.username }}

            </p>

            <div class="actions">

                <a href="{% url 'update_ngo' ngo.id %}">

                    Update

                </a>

            </div>

        </div>

        {% empty %}

        <p class="empty-text">

            No NGOs available.

        </p>

        {% endfor %}

    </div>

    <!-- ================= IMAGE GALLERY ================= -->

    <h2 class="gallery-title">

        NGO Gallery

    </h2>

    <div class="ngo-gallery">

        <img src="{% static 'images/valo.jpg' %}" alt="NGO 1">

        <img src="{% static 'images/ash.webp' %}" alt="NGO 2">

        <img src="{% static 'images/ngo.jpg' %}" alt="NGO 3">

    </div>

</div>

{% endblock %}
