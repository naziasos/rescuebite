{% extends 'base.html' %}

{% block content %}

<div class="ngo-page">

    <div class="ngo-header">
        <h2>NGO List</h2>

        <a class="add-btn" href="/ngo/create-ngo/">
            + Add NGO
        </a>
    </div>

    <div class="ngo-grid">

        {% for ngo in ngos %}

        <div class="ngo-card">

            <!-- NGO NAME (MAIN FIX) -->
            <h3>{{ ngo.ngo_name }}</h3>

            <!-- USER LINKED TO NGO -->
            <p><b>User:</b> {{ ngo.user.username }}</p>

            <div class="actions">
                <a href="/ngo/update-ngo/{{ ngo.id }}/">Update</a>
            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
