<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<h1>Claims</h1>

<hr>

<a href="/donation/create-claim/">

    Create Claim

</a>

<hr>

{% for claim in claims %}

    <p>

        Food:
        {{ claim.food.food_name }}

    </p>

    <p>

        NGO:
        {{ claim.ngo.username }}

    </p>

    <p>

        Status:
        {{ claim.status }}

    </p>

    <a href="/donation/update-claim/{{ claim.id }}/">

        Update

    </a>

    <hr>

{% endfor %}

{% endblock %}
</body>
</html>
