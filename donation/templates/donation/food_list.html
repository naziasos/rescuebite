{% extends 'base.html' %}

{% block content %}

<div class="food-page">

    <div class="food-header">
        <h2>Food Items</h2>

        <a class="add-btn" href="/donation/create-food/">
            + Add Food
        </a>
    </div>

    <div class="food-grid">

        {% for food in foods %}

        <div class="food-card">

            <h3 class="food-title">{{ food.food_name }}</h3>

            <p>Restaurant: {{ food.restaurant.username }}</p>
            <p>Quantity: {{ food.quantity }}</p>
            <p>Status: {{ food.status }}</p>

            <div class="actions">
                <a href="/donation/update-food/{{ food.id }}/">Edit</a>
                <a href="/donation/delete-food/{{ food.id }}/">Delete</a>
            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
