<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<h1>Food Items</h1>

<hr>

{% for food in foods %}

    <h3>{{ food.food_name }}</h3>

    <p>Restaurant: {{ food.restaurant.username }}</p>

    <p>Quantity: {{ food.quantity }}</p>

    <p>Status: {{ food.status }}</p>

    <hr>

{% endfor %}

{% endblock %}
</body>
</html>
