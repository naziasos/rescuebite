{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <div class="form-box">

        <h1>{{ title }}</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Save
            </button>

        </form>

    </div>

</div>

{% endblock %}
