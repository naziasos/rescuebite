<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<div class="login-container">

    <div class="login-box">

        <h1>

            Welcome Back

        </h1>

        <p>

            Login to your account

        </p>

        {% if error %}

        <p class="error">

            {{ error }}

        </p>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Enter your username">

            <input type="password"
                   name="password"
                   placeholder="Enter your password">

            <button type="submit">

                Login

            </button>

        </form>

        <p class="register-link">

            Don't have an account?

            <a href="/register/">

                Register here

            </a>

        </p>

    </div>

</div>

{% endblock %}
</body>
</html>
