<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}
<h1>
    Notifications
</h1>
<hr>
{% for notification in notifications %}
    <p>
        User:
        {{ notification.user.username }}
    </p>
    <p>
        Message:
        {{ notification.message }}
    </p>
    <p>
        Read:
        {{ notification.is_read }}
    </p>
    <hr>

{% endfor %}
{% endblock %}
</body>
</html>
