<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<div class="login-container">

    <div class="login-box">

        <h1>

            Create Account

        </h1>

        <p>

            Register your RescueBite account

        </p>

        {% if error %}

        <p class="error">

            {{ error }}

        </p>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Username">

            <input type="email"
                   name="email"
                   placeholder="Email">

            <input type="password"
                   name="password"
                   placeholder="Password">

            <button type="submit">

                Register

            </button>

        </form>

    </div>

</div>

{% endblock %}
</body>
</html>
