<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<h1>

    Register

</h1>

<hr>

{% if error %}

<p>

    {{ error }}

</p>

{% endif %}

<form method="POST">

    {% csrf_token %}

    <p>

        Username

    </p>

    <input type="text"
           name="username">

    <p>

        Email

    </p>

    <input type="email"
           name="email">

    <p>

        Password

    </p>

    <input type="password"
           name="password">

    <br><br>

    <button type="submit">

        Register

    </button>

</form>

{% endblock %}
</body>
</html>
